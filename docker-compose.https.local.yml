# Local HTTPS development. Needs `bash scripts/local-tls.sh`, then the app is on
# https://localhost:8443 while plain http://127.0.0.1:3000 stays reachable.
# Apply after docker-compose.yml and docker-compose.local.yml.
services:
  innobuddy:
    environment:
      # Secure cookies require the browser to reach the app over HTTPS.
      AUTH_COOKIE_SECURE: "true"
      AUTH_OIDC_ALLOW_HTTP: "true"
  https:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/upgrade.conf:/etc/nginx/conf.d/upgrade.conf:ro
      - ./deploy/tls-local:/etc/nginx/tls:ro
    depends_on:
      - innobuddy
    restart: unless-stopped
